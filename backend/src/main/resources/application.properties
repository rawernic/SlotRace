spring.application.name=slotrace-backend

spring.datasource.url=${SLOTRACE_DB_URL:jdbc:postgresql://localhost:5432/slotrace}
spring.datasource.username=${SLOTRACE_DB_USER:slotrace}
spring.datasource.password=${SLOTRACE_DB_PASSWORD:slotrace}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=64

management.endpoints.web.exposure.include=health
