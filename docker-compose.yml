services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: slotrace
      POSTGRES_USER: slotrace
      POSTGRES_PASSWORD: slotrace
    ports:
      - "5432:5432"
    volumes:
      - slotrace-daten:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slotrace -d slotrace"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      SLOTRACE_DB_URL: jdbc:postgresql://db:5432/slotrace
      SLOTRACE_DB_USER: slotrace
      SLOTRACE_DB_PASSWORD: slotrace
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  slotrace-daten:
